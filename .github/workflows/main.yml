name: Build ALL
run-name: Build ALL
on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read

jobs:
  Check_Version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and build number
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            python3 check_version.py --tag "${{ github.ref_name }}"
          else
            python3 check_version.py --skip-tags
          fi
  Build_MacOS:
    needs: Check_Version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - run: flutter pub get

      - name: Check rust-toolchain.toml
        run: rustup show

      - name: Build Flutter macOS App
        run: flutter build macos --release

      - name: Create DMG
        run: |
          mkdir -p dist
          mkdir -p dist/dmg_contents
          cp -R build/macos/Build/Products/Release/veneraGo.app dist/dmg_contents/
          ln -s /Applications dist/dmg_contents/Applications
          hdiutil create -volname "veneraGo" -srcfolder dist/dmg_contents -ov -format UDZO "dist/veneraGo.dmg"

      - name: Add version to filename
        run: |
          APP_VERSION=$(grep "version:" pubspec.yaml | cut -d':' -f2 | tr -d ' ')
          mkdir -p result
          mv dist/veneraGo.dmg "result/veneraGo-${APP_VERSION}.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos_build
          path: result/
  Build_IOS:
    needs: Check_Version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          cd "$GITHUB_WORKSPACE/build/ios/iphoneos"
          rm -rf Payload veneraGo-ios.ipa
          mkdir Payload
          mv Runner.app Payload/
          zip -r veneraGo-ios.ipa Payload
      - name: Add version to filename
        run: |
          APP_VERSION=$(grep "version:" pubspec.yaml | cut -d':' -f2 | tr -d ' ')
          mkdir -p result
          mv build/ios/iphoneos/veneraGo-ios.ipa "result/veneraGo-ios-${APP_VERSION}.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios_build
          path: result/
  Build_Android:
    needs: Check_Version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf /opt/hostedtoolcache
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
      - name: Decode and validate Android signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEY_PROPERTIES" ]; then
            echo "::error::ANDROID_KEYSTORE and ANDROID_KEY_PROPERTIES must both be configured"
            exit 1
          fi

          echo "$ANDROID_KEYSTORE" | base64 --decode > android/keystore.jks
          echo "$ANDROID_KEY_PROPERTIES" > android/key.properties

          get_prop() {
            sed -n "s/^$1=//p" android/key.properties | tail -n1 | tr -d '\r'
          }

          STORE_PASSWORD=$(get_prop storePassword)
          KEY_ALIAS=$(get_prop keyAlias)
          KEY_PASSWORD=$(get_prop keyPassword)
          STORE_PATH=$(get_prop storeFile)

          for name in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD STORE_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name in ANDROID_KEY_PROPERTIES"
              exit 1
            fi
          done

          case "$STORE_PATH" in
            /*) ;;
            *) STORE_PATH="android/app/$STORE_PATH" ;;
          esac

          if [ ! -s "$STORE_PATH" ]; then
            echo "::error::Keystore not found or empty: $STORE_PATH"
            echo "::error::Ensure ANDROID_KEYSTORE is set and storeFile points to ../keystore.jks"
            exit 1
          fi

          KEYSTORE_INFO=$(keytool -list -keystore "$STORE_PATH" -storepass "$STORE_PASSWORD" 2>&1) || {
            echo "::error::Cannot open keystore $STORE_PATH with the configured storePassword"
            echo "$KEYSTORE_INFO"
            exit 1
          }

          # PKCS12 keystores cannot store a key password different from the store
          # password. keytool silently ignores -keypass for them, so `-certreq`
          # below would "validate" a wrong keyPassword and Gradle would only fail
          # later, after a 15 minute build, in :app:packageRelease.
          if echo "$KEYSTORE_INFO" | grep -q 'PKCS12' && [ "$STORE_PASSWORD" != "$KEY_PASSWORD" ]; then
            echo "::error::PKCS12 keystore does not support keyPassword != storePassword"
            echo "::error::Set keyPassword equal to storePassword in ANDROID_KEY_PROPERTIES, or convert the keystore to JKS"
            exit 1
          fi

          if ! keytool -list -keystore "$STORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Alias $KEY_ALIAS not found in $STORE_PATH"
            exit 1
          fi

          # For JKS this actually decrypts the key with keyPassword; for PKCS12 the
          # equality check above is what guarantees the key password is correct.
          keytool -certreq -alias "$KEY_ALIAS" -keystore "$STORE_PATH" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -file /dev/null >/dev/null

          echo "Android signing configuration validated."
      - name: Check rust-toolchain.toml
        run: rustup show
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/app/outputs/apk/release
  Build_Windows:
    needs: Check_Version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: | 
          choco install yq -y
          pip install httpx
      - name: Install Inno Setup
        run: choco install innosetup --no-progress
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - name: build
        run: |
          flutter pub get
          python windows/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows_build
          path: build/windows/veneraGo-*
  Build_Linux:
    needs: Check_Version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1
          dart pub global activate -s git https://github.com/venera-app/flutter_to_debian.git
      - run: python3 debian/build.py x64
      # flutter_to_arch derives the executable name from the Dart package name
      # ("venera"), so provide a hard link for packaging while the real binary
      # keeps the veneraGo name.
      - run: ln -f build/linux/x64/release/bundle/veneraGo build/linux/x64/release/bundle/venera
      - run: dart run flutter_to_arch
      - name: Rename Arch package
        run: |
          for f in build/linux/arch/venera-*.pkg.tar.zst; do
            [ -e "$f" ] || continue
            mv "$f" "${f/\/venera-/\/veneraGo-}"
          done
      - run: |
          sudo rm -rf build/linux/arch/app.tar.gz
          sudo rm -rf build/linux/arch/pkg
          sudo rm -rf build/linux/arch/src
          sudo rm -rf build/linux/arch/PKGBUILD
      - uses: actions/upload-artifact@v4
        with:
          name: deb_build
          path: build/linux/x64/release/debian
      - uses: actions/upload-artifact@v4
        with:
          name: arch_build
          path: build/linux/arch/
  Build_Linux_ARM64:
    needs: Check_Version
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          flutter-version-file: pubspec.yaml
      - run: |
          flutter pub get
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1
          dart pub global activate -s git https://github.com/venera-app/flutter_to_debian.git
      - name: "Patch font"
        run: |
          dart run patch/font.dart
      - run: python3 debian/build.py arm64
      - uses: actions/upload-artifact@v4
        with:
          name: deb_arm64_build
          path: build/linux/x64/release/debian # This is a bug related to flutter_to_debian, but it's not a big deal.

  Release:
    runs-on: ubuntu-22.04
    needs: [Check_Version, Build_MacOS, Build_IOS, Build_Android, Build_Windows, Build_Linux, Build_Linux_ARM64]
    # 任一平台失败时仍然收集已成功的产物，但不要在整个流程被取消时发布
    if: ${{ needs.Check_Version.result == 'success' && !cancelled() && github.event_name == 'release' }}
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        id: download_macos
        if: needs.Build_MacOS.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: macos_build
          path: outputs
      - name: Download iOS artifact
        id: download_ios
        if: needs.Build_IOS.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios_build
          path: outputs
      - name: Download Android artifact
        id: download_android
        if: needs.Build_Android.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: outputs
      - name: Download Windows artifact
        id: download_windows
        if: needs.Build_Windows.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: windows_build
          path: outputs
      - name: Download Linux artifact
        id: download_linux
        if: needs.Build_Linux.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: deb_build
          path: outputs
      - name: Download Arch Linux artifact
        id: download_arch
        if: needs.Build_Linux.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: arch_build
          path: outputs
      - name: Download Linux ARM64 artifact
        id: download_linux_arm64
        if: needs.Build_Linux_ARM64.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: deb_arm64_build
          path: outputs
      - name: Check downloaded artifacts
        id: artifacts
        run: |
          mkdir -p outputs
          count=$(find outputs -type f | wc -l | tr -d '[:space:]')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Downloaded $count artifact file(s)."
          {
            echo "## Release artifact status"
            echo ""
            echo "| Platform | Build | Download |"
            echo "|---|---|---|"
            echo "| macOS | ${{ needs.Build_MacOS.result }} | ${{ steps.download_macos.outcome }} |"
            echo "| iOS | ${{ needs.Build_IOS.result }} | ${{ steps.download_ios.outcome }} |"
            echo "| Android | ${{ needs.Build_Android.result }} | ${{ steps.download_android.outcome }} |"
            echo "| Windows | ${{ needs.Build_Windows.result }} | ${{ steps.download_windows.outcome }} |"
            echo "| Linux x64 | ${{ needs.Build_Linux.result }} | ${{ steps.download_linux.outcome }} |"
            echo "| Arch Linux | ${{ needs.Build_Linux.result }} | ${{ steps.download_arch.outcome }} |"
            echo "| Linux ARM64 | ${{ needs.Build_Linux_ARM64.result }} | ${{ steps.download_linux_arm64.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Warn about incomplete release
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo "::warning::One or more platform builds did not succeed; only successful artifacts will be published."
      - name: Fail if no artifacts were downloaded
        if: steps.artifacts.outputs.count == '0'
        run: |
          echo "::error::No build artifacts were downloaded, aborting release."
          exit 1
      - name: Publish release
        if: steps.artifacts.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            outputs/*.ipa
            outputs/*.dmg
            outputs/*.apk
            outputs/*.zip
            outputs/*.exe
            outputs/*.deb
            outputs/*.zst
            outputs/*.AppImage
        env:
          GITHUB_TOKEN: ${{ github.token }}
