plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// versionCode = build number * 10 + lane.
// Universal must be higher than the ABI splits so it can replace them, and
// debug must be higher than every release lane so debug builds can upgrade
// release installs that use the same signing key.
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]
ext.profileCode = 7
ext.universalCode = 8
ext.debugCode = 9

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

// pubspec.yaml is the single source of truth. Never fall back to a default
// versionCode: an APK built with versionCode 1 cannot upgrade anything and
// the mistake is only visible after it has been published.
def pubspecFile = rootProject.file("../pubspec.yaml")
def flutterVersionName = null
def flutterVersionCode = null
if (pubspecFile.exists()) {
    def versionMatcher = pubspecFile.text =~ /(?m)^version:[ \t]*(\d+\.\d+\.\d+)(?:\+(\d+))?[ \t]*$/
    if (versionMatcher.find()) {
        flutterVersionName = versionMatcher.group(1)
        if (versionMatcher.group(2) != null) {
            flutterVersionCode = versionMatcher.group(2)
        }
    }
}
if (flutterVersionName == null) {
    // Only used when pubspec.yaml is unavailable (e.g. a partial IDE sync).
    flutterVersionName = localProperties.getProperty("flutter.versionName")
    flutterVersionCode = localProperties.getProperty("flutter.versionCode")
}
if (flutterVersionName == null) {
    throw new GradleException(
        "Cannot determine versionName: expected 'version: X.Y.Z+N' in ${pubspecFile}"
    )
}
if (flutterVersionCode == null
        || !flutterVersionCode.toString().isInteger()
        || flutterVersionCode.toInteger() < 1) {
    throw new GradleException(
        "Cannot determine versionCode: add a build number to pubspec.yaml, " +
        "for example 'version: 1.7.9+10709'."
    )
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    namespace = "com.github.axmishell.venera"
    compileSdk = flutter.compileSdkVersion
    ndkVersion "28.0.13004108"

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    splits{
        abi {
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            enable true
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions{
        jvmTarget = JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId = "com.github.axmishell.venera"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig signingConfigs.release
        }
        debug {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (variant.buildType.name == "release") {
                if (abi != null) {
                    outputFileName = "veneraGo-${variant.versionName}-${abi}.apk"
                    def abiVersionCode = project.ext.abiCodes.get(abi)
                    if (abiVersionCode != null) {
                        versionCodeOverride = variant.versionCode * 10 + abiVersionCode
                    }
                } else {
                    outputFileName = "veneraGo-${variant.versionName}.apk"
                    versionCodeOverride = variant.versionCode * 10 + project.ext.universalCode
                }
            } else if (variant.buildType.name == "debug") {
                versionCodeOverride = variant.versionCode * 10 + project.ext.debugCode
            } else {
                versionCodeOverride = variant.versionCode * 10 + project.ext.profileCode
            }
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
